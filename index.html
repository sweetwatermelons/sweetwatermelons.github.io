<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sweet🍉的小站</title>
<style>
  /* ================= 基础重置 ================= */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }

  body {
    /* 清新天蓝色渐变背景 */
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.8) 2px, transparent 2px),
      linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    background-size: 40px 40px, 100% 100%;
    
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 底部整体使用宋体 */
    font-family: 'Songti SC', 'SimSun', 'Georgia', serif;
    padding: 20px;
    overflow: hidden;
  }

  /* 主容器 */
  .container {
    max-width: 950px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center; 
    margin-top: -5vh;
  }

  /* ================= 标题区域 ================= */
  .title-wrap {
    display: flex;
    flex-direction: column;
    align-items: center; 
    width: 100%;
  }

  .title {
    font-size: 4.5rem;
    font-weight: 900;
    letter-spacing: 1px;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
    text-shadow: 0 4px 15px rgba(255, 255, 255, 0.8);
    
    /* 标题恢复为无衬线圆润字体 */
    font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
  }

  .title .en {
    /* 英文部分保留一点衬线斜体优雅感 */
    font-family: 'Georgia', serif; 
    font-style: italic;
    transform: rotate(-3deg); 
  }

  .title .emoji {
    font-size: 4rem;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; 
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(10deg); }
  }

  .title .zh {
    font-size: 2.8rem;
    font-weight: 700;
    color: #0284c7;
  }

  /* 蓝色渐变线 */
  .underline {
    width: 60%;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #38bdf8 50%, transparent 100%);
    border-radius: 2px;
    margin-bottom: 45px; 
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
  }

  /* ================= 中间操作区 ================= */
  .action-area {
    display: flex;
    align-items: center;
    justify-content: center; 
    gap: 40px; 
    width: 100%;
    margin-bottom: 40px;
  }

  /* 我的小作品：纯文本，无链接，无光标 */
  .my-works {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.35rem; 
    font-weight: 700;
    color: #0369a1; 
    user-select: none; /* 防止文字被选中，看起来更像装饰 */
  }

  .my-works::before {
    content: '✨';
    font-size: 1.2rem;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
  }

  /* 新标签页：胶囊按钮样式 */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 32px;
    background: #ffffff;
    backdrop-filter: blur(10px); 
    border: 1px solid rgba(255, 255, 255, 0.5); 
    border-radius: 50px;
    font-size: 1.15rem;
    font-weight: 700;
    color: #0369a1;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 15px rgba(3, 105, 161, 0.1);
    white-space: nowrap;
  }

  .btn:hover {
    transform: translateY(-3px);
    border-color: #38bdf8;
    color: #0284c7;
    box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
  }

  .btn svg {
    width: 20px;
    height: 20px;
    fill: #38bdf8;
    transition: fill 0.3s, transform 0.3s;
  }

  .btn:hover svg {
    fill: #0284c7;
    transform: rotate(5deg);
  }

  /* ================= 底部简介区 ================= */
  .description {
    font-size: 1.15rem;
    line-height: 1.8;
    color: #475569;
    text-align: center; 
    letter-spacing: 1px; 
  }

  .kaomoji {
    display: inline-block;
    margin-left: 8px;
    font-family: 'Courier New', Courier, monospace;
    color: #0284c7;
    font-weight: bold;
    cursor: default;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .kaomoji:hover {
    transform: translateY(-5px) scale(1.15);
    color: #38bdf8;
    text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
  }

  /* ================= 响应式适配 ================= */
  @media (max-width: 768px) {
    body {
      align-items: flex-start;
      padding-top: 15vh;
    }
    .container {
      margin-top: 0;
    }
    .title {
      font-size: 2.8rem;
      flex-wrap: wrap;
      gap: 8px;
    }
    .title .emoji { font-size: 2.8rem; }
    .title .zh { font-size: 2rem; }
    
    .action-area {
      flex-direction: column;
      gap: 25px;
    }
    
    .description {
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

  <div class="container">
    <!-- 标题区域 -->
    <div class="title-wrap">
      <h1 class="title">
        <span class="en">sweet</span>
        <span class="emoji">🍉</span>
        <span class="zh">的小站</span>
      </h1>
      <div class="underline"></div>
    </div>

    <!-- 按钮区：纯文字 + 胶囊按钮 -->
    <div class="action-area">
      <!-- 左侧：我的小作品（纯文本，无链接） -->
      <span class="my-works">
        我的小作品
      </span>

      <!-- 右侧：新标签页（胶囊按钮） -->
      <a href="https://sweetwatermelons.github.io/newtab.html" target="_blank" class="btn">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        新标签页
      </a>
    </div>

    <!-- 底部：简介 -->
    <p class="description">
      喜欢神秘的东西qwq，顺便搞一点小代码~
      <span class="kaomoji">(˘•ω•˘)◞⁺✧</span>
    </p>

  </div>

</body>
</html>
