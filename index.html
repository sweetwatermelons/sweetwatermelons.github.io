<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sweet🍉的小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  body {
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    background-image: radial-gradient(rgba(255, 255, 255, 0.8) 2px, transparent 2px), linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    background-size: 40px 40px, 100% 100%;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    padding: 20px; overflow-x: hidden;
  }

  .container {
    max-width: 1000px; width: 100%;
    display: flex; flex-direction: column; align-items: center; margin-top: -2vh;
  }

  /* 标题区 */
  .title-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .title { font-size: 4.5rem; font-weight: 900; color: #0f172a; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-shadow: 0 4px 15px rgba(255, 255, 255, 0.8); }
  .title .en { font-family: 'Georgia', serif; font-style: italic; transform: rotate(-3deg); }
  .title .emoji { font-size: 4rem; display: inline-block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(10deg); } }
  .title .zh { font-size: 2.8rem; font-weight: 700; color: #0284c7; }
  .underline { width: 60%; height: 4px; background: linear-gradient(90deg, transparent 0%, #ffb6c1 50%, transparent 100%); border-radius: 2px; margin-bottom: 35px; box-shadow: 0 0 12px rgba(255, 182, 193, 0.5); }

  /* 操作区 */
  .action-area { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 880px; margin-bottom: 35px; }
  .my-works { display: inline-flex; align-items: center; gap: 8px; font-size: 1.35rem; font-weight: 700; color: #0369a1; }
  .my-works::before { content: '✨'; font-size: 1.2rem; }
  .right-buttons { display: flex; align-items: center; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: #ffffff; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 50px; font-size: 0.95rem; font-weight: 700; color: #0369a1; text-decoration: none; transition: all 0.3s; box-shadow: 0 4px 15px rgba(3, 105, 161, 0.1); white-space: nowrap; }
  .btn:hover { transform: translateY(-3px); border-color: #38bdf8; color: #0284c7; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); }
  .btn svg { width: 18px; height: 18px; fill: #38bdf8; transition: fill 0.3s, transform 0.3s; }
  .btn:hover svg { fill: #0284c7; transform: rotate(5deg); }

  /* 简介 */
  .description { font-size: 1.15rem; line-height: 1.8; color: #475569; text-align: center; margin-bottom: 40px; }
  .kaomoji { display: inline-block; margin-left: 8px; font-family: 'Courier New', monospace; color: #0284c7; font-weight: bold; transition: 0.3s; }
  .kaomoji:hover { transform: translateY(-5px) scale(1.15); color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.8); }

  /* 页脚 */
  .footer-links { display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .footer-links a { color: #0284c7; text-decoration: none; font-weight: 600; transition: 0.2s; padding: 8px 16px; border-radius: 20px; }
  .footer-links a:hover { color: #fff; background: #38bdf8; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); }
  .footer-text { color: #64748b; font-size: 13px; }
  .footer-text a { padding: 0; font-size: 13px; color: #0284c7; font-weight: 600; }
  .footer-text a:hover { background: transparent; color: #38bdf8; box-shadow: none; text-decoration: underline;}

  /* ================= 悬浮二维码终极放大版 ================= */
  .feedback-area {
    position: relative;
    margin-top: 24px;
    display: flex;
    justify-content: center;
    z-index: 10;
  }

  .feedback-link {
    font-size: 14px; /* 文字稍微放大一点呼应大图 */
    color: #0284c7;
    font-weight: 700;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 30px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #ffffff;
    box-shadow: 0 4px 15px rgba(3, 105, 161, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  .feedback-link:hover {
    color: #ffffff;
    background: #38bdf8;
    box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
    transform: translateY(-2px);
  }

  /* 悬浮面板 */
  .qrcode-popup {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(0px) scale(0.95);
    background: rgba(255, 255, 255, 1); /* 纯白背景，让二维码更清晰 */
    border: 1px solid rgba(255, 255, 255, 1);
    border-radius: 24px; /* 圆角更大 */
    padding: 20px; /* 内边距加大 */
    box-shadow: 0 20px 40px rgba(3, 105, 161, 0.25), 0 0 0 1px rgba(0,0,0,0.05); /* 阴影加深加厚 */
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 999999;
  }

  /* 底部小三角变大 */
  .qrcode-popup::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border-width: 10px; 
    border-style: solid;
    border-color: #ffffff transparent transparent transparent;
  }

  /* 核心修改：直接放大到 280px */
  .qrcode-popup img {
    width: 280px;
    height: 280px;
    border-radius: 12px;
    display: block;
    object-fit: contain;
  }

  /* 悬浮显示逻辑 */
  .feedback-area:hover .qrcode-popup {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(-15px) scale(1);
    pointer-events: auto;
  }

  /* 手机端隐藏二维码 */
  @media (max-width: 860px) {
    .title { font-size: 2.8rem; flex-wrap: wrap; gap: 8px; }
    .title .emoji { font-size: 2.8rem; }
    .title .zh { font-size: 2rem; }
    .action-area { flex-direction: column; gap: 25px; }
    .right-buttons { flex-direction: column; width: 100%; gap: 12px; }
    .btn { width: 100%; justify-content: center; padding: 12px 20px; font-size: 1rem;}
    .description { font-size: 1rem; }
    .qrcode-popup { display: none !important; }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="title-wrap">
      <h1 class="title">
        <span class="en">sweet</span>

        </a>
        <a href="https://sweetwatermelons.github.io/luckywheel.html" target="_blank" class="btn">

        <a href="https://sweetwatermelons.github.io/dino.html" target="_blank" class="btn pixel-dino-btn">

    <div class="footer-links">
