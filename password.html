<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器</title>
<style>
  :root {
    --bg: #0f111a;
    --card-bg: rgba(25, 28, 41, 0.65);
    --card-border: rgba(255, 255, 255, 0.08);
    --text: #eef2ff;
    --text-mute: #94a3b8;
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.4);
    --danger: #ef4444;
    --warning: #f59e0b;
    --safe: #10b981;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
  
  body {
    background-color: var(--bg);
    background-image: radial-gradient(#2a2e3d 1px, transparent 1px);
    background-size: 30px 30px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    padding: 20px;
  }

  /* 主面板 - 毛玻璃效果 */
  .generator-card {
    background: var(--card-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 32px;
    padding: 40px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #a5b4fc, #818cf8, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .header p { font-size: 13px; color: var(--text-mute); }

  /* 密码展示区 */
  .password-display {
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid var(--card-border);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 15px;
    transition: border-color 0.3s;
  }
  .password-display:hover { border-color: rgba(255, 255, 255, 0.2); }
  
  .password-text {
    font-family: 'Fira Code', 'Courier New', monospace;
    font-size: 22px;
    font-weight: 600;
    word-break: break-all;
    letter-spacing: 2px;
    flex: 1;
    user-select: all;
  }

  .copy-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  .copy-btn:hover { background: #4f46e5; transform: scale(1.05); }
  .copy-btn:active { transform: scale(0.95); }
  .copy-btn svg { width: 22px; height: 22px; fill: currentColor; }

  /* 安全等级条 */
  .security-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 30px;
  }
  .sec-block {
    height: 6px;
    flex: 1;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 设置选项 */
  .options { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
  
  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .option-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-mute);
  }
  .option-label span { color: var(--text); font-size: 18px; margin-left: 5px; }

  /* 滑动条 */
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; cursor: pointer;
    box-shadow: 0 0 15px var(--accent);
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: rgba(255, 255, 255, 0.15);
  }

  /* 开关 */
  .switch {
    position: relative;
    display: inline-block;
    width: 48px;
    height: 26px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(255, 255, 255, 0.1);
    transition: .3s; border-radius: 26px;
  }
  .slider:before {
    position: absolute; content: "";
    height: 20px; width: 20px;
    left: 3px; bottom: 3px;
    background-color: #fff;
    transition: .3s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(22px); }

  /* 生成按钮 */
  .generate-btn {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, var(--accent), #818cf8);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 10px 25px var(--accent-glow);
  }
  .generate-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .generate-btn:active { transform: translateY(0); }

  /* 动画 */
  @keyframes popIn {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .password-text.animate { animation: popIn 0.3s ease-out; }

  /* Toast 提示 */
  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--safe); color: white; padding: 12px 24px; border-radius: 12px;
    font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
    opacity: 0; transition: all 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="generator-card">
    <div class="header">
      <h1>🛡️ 密码生成器</h1>
      <p>基于密码学安全的随机生成算法</p>
    </div>

    <!-- 密码展示区 -->
    <div class="password-display">
      <div class="password-text" id="passwordText">点击下方生成</div>
      <button class="copy-btn" id="copyBtn" title="复制密码">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
    </div>

    <!-- 安全等级条 -->
    <div class="security-bar" id="securityBar">
      <div class="sec-block"></div>
      <div class="sec-block"></div>
      <div class="sec-block"></div>
      <div class="sec-block"></div>
    </div>

    <!-- 设置选项 -->
    <div class="options">
      <div class="option-row">
        <div class="option-label">密码长度 <span id="lenValue">16</span></div>
      </div>
      <input type="range" id="lengthSlider" min="8" max="64" value="16">
      
      <div class="option-row">
        <label class="option-label">包含大写字母 (A-Z)</label>
        <label class="switch">
          <input type="checkbox" id="includeUpper" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <label class="option-label">包含小写字母 (a-z)</label>
        <label class="switch">
          <input type="checkbox" id="includeLower" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <label class="option-label">包含数字 (0-9)</label>
        <label class="switch">
          <input type="checkbox" id="includeNumbers" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <label class="option-label">包含符号 (!@#$)</label>
        <label class="switch">
          <input type="checkbox" id="includeSymbols" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <label class="option-label">排除易混淆字符 (i,I,l,1,O,0)</label>
        <label class="switch">
          <input type="checkbox" id="excludeAmbiguous" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn">生成高强度密码</button>
  </div>

  <div class="toast" id="toast">已复制到剪贴板 ✅</div>

<script>
(function() {
  'use strict';

  const passwordText = document.getElementById('passwordText');
  const copyBtn = document.getElementById('copyBtn');
  const generateBtn = document.getElementById('generateBtn');
  const lengthSlider = document.getElementById('lengthSlider');
  const lenValue = document.getElementById('lenValue');
  const securityBar = document.getElementById('securityBar');
  const blocks = securityBar.querySelectorAll('.sec-block');
  
  const includeUpper = document.getElementById('includeUpper');
  const includeLower = document.getElementById('includeLower');
  const includeNumbers = document.getElementById('includeNumbers');
  const includeSymbols = document.getElementById('includeSymbols');
  const excludeAmbiguous = document.getElementById('excludeAmbiguous');

  const toast = document.getElementById('toast');

  // 密码字符池
  const CHARS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    number: '0123456789',
    symbol: '!@#$%^&*()_+-=[]{}|;:,.<>?/~'
  };
  
  const AMBIGUOUS = 'iIl1O0o';

  // 更新滑动条数值
  lengthSlider.addEventListener('input', (e) => {
    lenValue.textContent = e.target.value;
    generatePassword(); // 拖动时实时生成
  });

  // 开关改变时实时生成
  [includeUpper, includeLower, includeNumbers, includeSymbols, excludeAmbiguous].forEach(el => {
    el.addEventListener('change', generatePassword);
  });

  // 密码学安全的随机数生成
  function secureRandomInt(max) {
    // 使用 Crypto API 产生真正的随机数，防止被预测
    if (window.crypto && window.crypto.getRandomValues) {
      const array = new Uint32Array(1);
      window.crypto.getRandomValues(array);
      return array[0] % max;
    }
    // 降级处理 (老旧浏览器)
    return Math.floor(Math.random() * max);
  }

  function generatePassword() {
    const length = parseInt(lengthSlider.value);
    let pool = '';

    // 构建字符池
    if (includeUpper.checked) pool += CHARS.upper;
    if (includeLower.checked) pool += CHARS.lower;
    if (includeNumbers.checked) pool += CHARS.number;
    if (includeSymbols.checked) pool += CHARS.symbol;

    // 排除易混淆字符
    if (excludeAmbiguous.checked) {
      for (let char of AMBIGUOUS) {
        pool = pool.split(char).join('');
      }
    }

    // 如果什么都没选，给个提示
    if (pool.length === 0) {
      passwordText.textContent = '请至少选择一种字符';
      passwordText.style.color = 'var(--danger)';
      updateSecurityBar(0);
      return;
    }

    passwordText.style.color = 'var(--text)';

    // 生成密码
    let password = '';
    for (let i = 0; i < length; i++) {
      password += pool[secureRandomInt(pool.length)];
    }

    // 更新 UI
    passwordText.textContent = password;
    passwordText.classList.remove('animate');
    void passwordText.offsetWidth; // 触发重绘
    passwordText.classList.add('animate');

    // 计算安全强度 (简易熵值计算)
    // 熵 = 长度 * log2(字符池大小)
    const entropy = length * Math.log2(pool.length);
    updateSecurityBar(entropy);
  }

  function updateSecurityBar(entropy) {
    blocks.forEach(b => {
      b.style.background = 'rgba(255, 255, 255, 0.1)';
      b.style.boxShadow = 'none';
    });

    // 熵值判断：<40 弱, 40-60 中, 60-80 强, >80 极强
    let activeCount = 0;
    let color = '';

    if (entropy === 0) activeCount = 0;
    else if (entropy < 40) { activeCount = 1; color = 'var(--danger)'; }
    else if (entropy < 60) { activeCount = 2; color = 'var(--warning)'; }
    else if (entropy < 80) { activeCount = 3; color = '#3b82f6'; }
    else { activeCount = 4; color = 'var(--safe)'; }

    for (let i = 0; i < activeCount; i++) {
      blocks[i].style.background = color;
      blocks[i].style.boxShadow = `0 0 10px ${color}`;
    }
  }

  // 复制功能
  copyBtn.addEventListener('click', () => {
    const text = passwordText.textContent;
    if (text === '点击下方生成' || text.includes('请至少')) return;

    navigator.clipboard.writeText(text).then(() => {
      showToast();
    }).catch(err => {
      // 降级处理
      const textArea = document.createElement('textarea');
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      showToast();
    });
  });

  let toastTimer;
  function showToast() {
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }

  // 生成按钮
  generateBtn.addEventListener('click', generatePassword);

  // 初始生成一次
  generatePassword();

})();
</script>
</body>
</html>
